name: Validate, publish, and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_REPOSITORY: praseth002/nibonobu-art-archive

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build application
        run: npm run build

  release:
    name: Publish and deploy
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.ENABLE_PRODUCTION_DEPLOY == 'true'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
            ${{ env.IMAGE_REPOSITORY }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure restricted Kubernetes access
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        shell: bash
        run: |
          test -n "$KUBE_CONFIG_B64"
          test -n "$KUBE_NAMESPACE"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"

      - name: Update application image
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        shell: bash
        run: |
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --namespace "$KUBE_NAMESPACE" \
            set image deployment/nibonobu-art-archive \
            app="$IMAGE_REPOSITORY@$IMAGE_DIGEST"

      - name: Wait for healthy rollout
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        shell: bash
        run: |
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --namespace "$KUBE_NAMESPACE" \
            rollout status deployment/nibonobu-art-archive \
            --timeout=5m

      - name: Show deployed image
        env:
          KUBE_NAMESPACE: ${{ secrets.KUBE_NAMESPACE }}
        shell: bash
        run: |
          kubectl --kubeconfig "$RUNNER_TEMP/kubeconfig" \
            --namespace "$KUBE_NAMESPACE" \
            get deployment nibonobu-art-archive \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="app")].image}{"\n"}'
